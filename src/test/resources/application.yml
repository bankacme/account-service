spring:
  application:
    name: account-service
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_account_test?directConnection=true
      auto-index-creation: false

bank:
  zone: America/Lima
  clients:
    customer-service:
      base-url: http://localhost:9999

resilience4j:
  circuitbreaker:
    instances:
      customer-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      customer-service:
        timeout-duration: 2s
        cancel-running-future: true
